[package]
name = "net-log-analyzer"
version = "0.1.0"
edition = "2021"
description = "AI-powered Network Log Analyzer and Intrusion Detection System"
license = "MIT"

[[bin]]
name = "net-log-analyzer"
path = "src/main.rs"

[dependencies]
# Packet capture
pcap = "2.2.0"

# Async runtime
tokio = { version = "1.44.1", features = ["full"] }

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Timestamps
chrono = { version = "0.4.40", features = ["serde"] }

# Argument parsing
clap = { version = "4.5.37", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
